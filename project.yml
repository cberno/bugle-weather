name: BugleWeather

options:
  bundleIdPrefix: com.charleyberno
  deploymentTarget:
    iOS: "17.0"

packages:
  BugleCore:
    path: BugleCore

targets:
  BugleWeather:
    type: application
    platform: iOS

    sources:
      - path: BugleWeatherApp
      - path: SharedSupport

    info:
      path: BugleWeatherApp/Info.plist
      properties:
        CFBundleDisplayName: Bugle Weather
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: Bugle Weather uses your location to grade today's weather where you are.
        UILaunchScreen: {}

    entitlements:
      path: BugleWeatherApp/BugleWeather.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.charleyberno.BugleWeather

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charleyberno.BugleWeather
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

    dependencies:
      - package: BugleCore
      - target: BugleWeatherWidgetExtension
        embed: true

  BugleWeatherWidgetExtension:
    type: app-extension
    platform: iOS

    sources:
      - path: BugleWeatherWidget
      - path: SharedSupport

    info:
      path: BugleWeatherWidget/Info.plist
      properties:
        CFBundleDisplayName: Bugle Weather
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    entitlements:
      path: BugleWeatherWidget/BugleWeatherWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.charleyberno.BugleWeather

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charleyberno.BugleWeather.widget
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

    dependencies:
      - package: BugleCore
